project_id = "portiter-blog"

[auth]
enable_signup = false

[functions.blog-publisher]
# Cron authenticates with the dedicated x-blog-cron-secret header; the endpoint
# does not accept user JWTs and validates this secret before doing any work.
verify_jwt = false

[functions.blog-generate]
# The browser invokes this function with the signed-in admin's JWT.
verify_jwt = true
